; Copy this file to config.local.ini and fill secrets.
; Do NOT commit config.local.ini with real credentials.

[database]
host = 127.0.0.1
port = 3306
name = whatsapp_bot
user = root
pass = 123qwe
charset = utf8mb4

[app]
env = development
base_url = http://localhost/whatsapp_bot/web
timezone = Asia/Kuala_Lumpur
session_name = WABOTSESSID
csrf_token_name = csrf_token
secure_cookies = 0
display_errors = 1
log_errors = 1
uploads_dir = uploads/media
max_upload_bytes = 10485760

[security]
; Change this to a long random string in production
app_key = "change-this-to-a-long-random-secret-key-32chars"
