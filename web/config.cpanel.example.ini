; cPanel production example — copy to config.local.ini on the server.
; Quote values that contain special characters.

[database]
host = localhost
port = 3306
name = synergy1_maxwellteh_whatsapp_ai
user = synergy1_shaoxi
pass = "YOUR_DB_PASSWORD_HERE"
charset = utf8mb4

[app]
env = production
; Change to your real domain, e.g. https://yourdomain.com/whatsapp_bot/web
base_url = https://YOUR_DOMAIN/whatsapp_bot/web
timezone = Asia/Kuala_Lumpur
session_name = WABOTSESSID
csrf_token_name = csrf_token
secure_cookies = 1
display_errors = 0
log_errors = 1
uploads_dir = uploads/media
max_upload_bytes = 10485760

[security]
app_key = "replace-with-long-random-secret-at-least-32-chars"
