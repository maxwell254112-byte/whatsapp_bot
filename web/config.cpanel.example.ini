; Production config for maxwellteh.kolejsynergy.com
; Rename to config.local.ini on the server and set DB password.

[database]
host = localhost
port = 3306
name = synergy1_maxwellteh_whatsapp_ai
user = synergy1_shaoxi
pass = "PUT_DB_PASSWORD_HERE"
charset = utf8mb4

[app]
env = production
base_url = https://maxwellteh.kolejsynergy.com/web
timezone = Asia/Kuala_Lumpur
session_name = WABOTSESSID
csrf_token_name = csrf_token
secure_cookies = 1
display_errors = 0
log_errors = 1
uploads_dir = uploads/media
